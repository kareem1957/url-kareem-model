[project]
name = "phishing-url-detector"
version = "0.1.0"
description = "Production-grade phishing URL detection system with explainable AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP", "S"]
ignore = ["S101", "E501"]  # S101: asserts ok in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
